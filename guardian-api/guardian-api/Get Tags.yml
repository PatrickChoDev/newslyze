info:
  name: Get Tags
  type: http
  seq: 1

http:
  method: GET
  url: https://content.guardianapis.com/tags?api-key={{APIKEY}}&page-size=1000
  params:
    - name: api-key
      value: "{{APIKEY}}"
      type: query
    - name: page-size
      value: "1000"
      type: query

runtime:
  variables:
    - name: APIKEY
      value: ab4de98f-45b1-42d8-b85f-df65936132e3

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
